              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      tags:
        - odbc-sqlserver
      summary: Create SQL Server User DSN
      description: Creates a new SQL Server 32-bit User DSN using A3-compatible registry values.
      security:
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SQLServerODBCDSNRequest'
      responses:
        '200':
          description: SQL Server DSN created successfully
