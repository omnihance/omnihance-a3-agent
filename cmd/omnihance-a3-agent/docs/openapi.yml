      responses:
        '200':
          description: SQL Server DSN retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SQLServerODBCDSN'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
