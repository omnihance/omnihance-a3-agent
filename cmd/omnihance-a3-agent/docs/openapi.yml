          description: DSN name
          example: "A3GameDB"
        server:
          type: string
          minLength: 1
          description: SQL Server host or instance name
          example: "localhost\\SQLEXPRESS"
        database:
          type: string
          minLength: 1
          description: Default database name
          example: "A3Game"
        login_id:
          type: string
          minLength: 1
          description: SQL user stored as LastUser in registry
