          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: DSN not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      tags:
        - odbc-sqlserver
      summary: Delete SQL Server User DSN
      description: Deletes a SQL Server User DSN by DSN name.
      security:
        - ApiKeyAuth: []
      parameters:
        - in: path
          name: name
          required: true
          schema:
            type: string
          description: DSN name
          example: "A3GameDB"
      responses:
        '200':
          description: SQL Server DSN deleted successfully
