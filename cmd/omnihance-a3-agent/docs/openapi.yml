                $ref: '#/components/schemas/ErrorResponse'
    put:
      tags:
        - odbc-sqlserver
      summary: Update SQL Server User DSN
      description: Updates an existing SQL Server User DSN by DSN name.
      security:
        - ApiKeyAuth: []
      parameters:
        - in: path
          name: name
          required: true
          schema:
            type: string
          description: DSN name
