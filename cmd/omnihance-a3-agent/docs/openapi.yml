          description: Server process deleted successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Process deleted successfully"
        '400':
          description: Bad Request - Invalid process ID
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/server/processes/reorder:
    post:
      tags:
        - server-management
      summary: Reorder server processes
      description: Updates the sequence order of multiple server processes. All processes must be provided with their new sequence orders.
      security:
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReorderServerProcessesRequest'
      responses:
        '200':
          description: Server processes reordered successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Processes reordered successfully"
        '400':
          description: Bad Request - Invalid request body or validation failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/server/start:
    post:
      tags:
        - server-management
      summary: Start full server sequence
      description: Starts all server processes in sequence order. Each process is started and verified (by port check if available, or process check) before the next one is started. Processes are started with health checks that wait up to 60 seconds for the process to become ready.
      security:
        - ApiKeyAuth: []
      responses:
        '200':
          description: Server started successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Server started successfully"
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error - Failed to start one or more processes
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/server/stop:
    post:
      tags:
        - server-management
      summary: Stop full server sequence
      description: Stops all server processes in reverse sequence order. Each process is stopped before moving to the previous one in the sequence.
      security:
        - ApiKeyAuth: []
      responses:
        '200':
          description: Server stopped successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Server stopped successfully"
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error - Failed to stop one or more processes
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/server/processes/{id}/start:
    post:
      tags:
        - server-management
      summary: Start an individual process
      description: Starts a specific server process by ID. The process is started with a health check that waits up to 60 seconds for the process to become ready (verified by port check if available, or process check).
      security:
        - ApiKeyAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            format: int64
          description: Server process ID
          example: 1
      responses:
        '200':
          description: Process started successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Process started successfully"
        '400':
          description: Bad Request - Invalid process ID
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error - Failed to start the process
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/server/processes/{id}/stop:
    post:
      tags:
        - server-management
      summary: Stop an individual process
      description: Stops a specific server process by ID.
      security:
        - ApiKeyAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            format: int64
          description: Server process ID
          example: 1
      responses:
        '200':
          description: Process stopped successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Process stopped successfully"
        '400':
          description: Bad Request - Invalid process ID
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error - Failed to stop the process
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/server/processes/{id}/status:
    get:
      tags:
        - server-management
      summary: Get process status
      description: Returns the current status of a server process including whether it is running, port status (if configured), start/end times, and uptime information.
      security:
        - ApiKeyAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            format: int64
          description: Server process ID
          example: 1
      responses:
        '200':
          description: Process status retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProcessStatus'
        '400':
          description: Bad Request - Invalid process ID
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/directory-shortcuts:
    get:
      tags:
        - directory-shortcuts
      summary: Get directory shortcuts
      description: Returns all directory shortcuts for the current user, including the configured limit and whether the user has exceeded the limit.
      security:
        - ApiKeyAuth: []
      responses:
        '200':
          description: Directory shortcuts retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DirectoryShortcutsResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      tags:
        - directory-shortcuts
      summary: Create directory shortcut
      description: Creates a new directory shortcut for the current user. Validates that the path is not root, not already in shortcuts, and that the user has not exceeded the limit. The path is normalized to prevent duplicates.
      security:
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateDirectoryShortcutRequest'
      responses:
        '200':
          description: Directory shortcut created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DirectoryShortcut'
        '400':
          description: Bad Request - Invalid request body, validation failed, path is root, directory already in shortcuts, or shortcut limit reached
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/directory-shortcuts/{id}:
    delete:
      tags:
        - directory-shortcuts
      summary: Delete directory shortcut
      description: Deletes a directory shortcut by ID. Only the owner of the shortcut can delete it.
      security:
        - ApiKeyAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            format: int64
          description: Directory shortcut ID
          example: 1
      responses:
        '200':
          description: Directory shortcut deleted successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Shortcut deleted successfully"
        '400':
          description: Bad Request - Invalid shortcut ID
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden - Not authorized to delete this shortcut
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Shortcut not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/odbc/sqlserver-dsns:
    get:
      tags:
