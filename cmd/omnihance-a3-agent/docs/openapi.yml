                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/odbc/sqlserver-dsns/{name}:
    get:
      tags:
        - odbc-sqlserver
      summary: Get SQL Server User DSN
      description: Returns one SQL Server User DSN by DSN name.
      security:
