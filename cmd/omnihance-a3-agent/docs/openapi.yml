          format: int64
          description: Total map client data records
          example: 42
        items:
          type: object
          description: Total item client data records by source IT file
          properties:
            it0:
              type: integer
              format: int64
              example: 100
            it1:
              type: integer
              format: int64
              example: 80
            it2:
              type: integer
              format: int64
              example: 25
            it3:
              type: integer
              format: int64
              example: 10
    UploadClientDataResponse:
      type: object
